<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Placement Portal</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Axios CDN -->
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
  {% raw %}
  <div id="app" class="d-flex justify-content-center align-items-center min-vh-100 px-3">
    <div class="glass-card p-5 shadow-lg w-100" style="max-width: 440px;">
      <div class="mb-4">
        <a href="/" class="btn btn-link text-slate-400 p-0 text-decoration-none small">
          <i class="bi bi-arrow-left"></i> Back to Home
        </a>
        <h2 class="fw-bold tracking-tight text-white mt-3 mb-1">Admin Portal</h2>
        <p class="text-slate-400">Sign in to the administrator portal</p>
      </div>

      <div v-if="error" class="alert alert-danger border-0 py-2 text-center small" role="alert">
        {{ error }}
      </div>

      <form @submit.prevent="handleLogin" novalidate>
        <div class="mb-3">
          <label for="admin-email" class="form-label text-slate-300">Email Address</label>
          <input type="email" id="admin-email" class="form-control" v-model="loginForm.email" required>
        </div>

        <div class="mb-4">
          <label for="admin-password" class="form-label text-slate-300">Password</label>
          <div class="input-group">
            <input :type="showPassword ? 'text' : 'password'" id="admin-password" class="form-control" v-model="loginForm.password" required>
            <button class="btn btn-outline-secondary border-secondary bg-slate-800 text-slate-400" type="button" @click="showPassword = !showPassword">
              <i :class="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold text-white" :disabled="loading">
          <span v-if="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Sign In
        </button>
      </form>
    </div>
  </div>
  {% endraw %}

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const loginForm = ref({ email: '', password: '' });
        const showPassword = ref(false);
        const error = ref('');
        const loading = ref(false);

        const handleLogin = async () => {
          if (!loginForm.value.email || !loginForm.value.password) {
            error.value = 'Please fill in all fields.';
            return;
          }
          error.value = '';
          loading.value = true;
          try {
            const res = await axios.post('/login', {
              email: loginForm.value.email,
              password: loginForm.value.password,
              role: 'Admin'
            });
            window.location.href = '/admin/dashboard';
          } catch (err) {
            error.value = err.response?.data?.message || 'Login failed. Please try again.';
          } finally {
            loading.value = false;
          }
        };

        return { loginForm, showPassword, error, loading, handleLogin };
      }
    }).mount('#app');
  </script>
</body>
</html>
